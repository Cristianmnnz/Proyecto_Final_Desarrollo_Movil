<ion-header>
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      label="Nombre completo"
      [(ngModel)]="name">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Edad"
      type="number"
      [(ngModel)]="age">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-select
      label="Sexo"
      placeholder="Selecciona"
      [(ngModel)]="sex">
      <ion-select-option value="Masculino">Masculino</ion-select-option>
      <ion-select-option value="Femenino">Femenino</ion-select-option>
      <ion-select-option value="Otro">Otro</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-input
      label="Email"
      type="email"
      [(ngModel)]="email">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Password"
      type="password"
      [(ngModel)]="password">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="onRegister()">
    Registrar
  </ion-button>

  <ion-text>
    <p class="ion-text-center">
      ¿Ya tienes cuenta?
      <a (click)="goLogin()">Login</a>
    </p>
  </ion-text>

</ion-content>
