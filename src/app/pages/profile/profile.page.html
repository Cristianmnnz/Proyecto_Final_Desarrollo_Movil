<ion-header>
  <ion-toolbar>
    <ion-title>Perfil</ion-title>

    <ion-buttons slot="end">
      <ion-button color="danger" (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="ion-text-center" style="margin-top: 20px;">
    <ion-avatar style="margin: auto; width: 140px; height: 140px;">
      
      <!-- Si hay imagen, la muestra -->
      <img *ngIf="profileImage; else defaultImg" [src]="profileImage" />

      <!-- Si no hay imagen, una por defecto -->
      <ng-template #defaultImg>
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ng-template>

    </ion-avatar>

    <ion-button expand="block" style="margin-top: 15px;" (click)="changePhoto()">
      Cambiar foto
    </ion-button>
  </div>

  <ion-card *ngIf="user">
  <ion-card-header>
    <ion-card-title>{{ user.name }}</ion-card-title>
    <ion-card-subtitle>{{ user.email }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p><strong>Edad:</strong> {{ user.age }}</p>
    <p><strong>Sexo:</strong> {{ user.sex }}</p>

    <p style="margin-top:10px;">Bienvenido a tu perfil 👋</p>
  </ion-card-content>
</ion-card>
